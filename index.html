<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MNTRL</title>
  <meta name="description" content="Portée par le collectif.">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="stylesheet" href="styles.css">
  <script>
    (function () {
      var saved = null;
      try { saved = localStorage.getItem("mntrl-lang"); } catch (e) {}
      var lang = saved;
      if (lang !== "fr" && lang !== "en") {
        var nav = (navigator.languages && navigator.languages[0]) || navigator.language || "fr";
        lang = String(nav).toLowerCase().indexOf("en") === 0 ? "en" : "fr";
      }
      document.documentElement.lang = lang;
    })();
  </script>
</head>
<body>
  <div class="lang" role="group" aria-label="Language">
    <button type="button" data-lang="fr">FR</button>
    <button type="button" data-lang="en">EN</button>
  </div>

  <div class="sheet">
    <main>
      <h1>
        <img src="logo.svg" alt="MNTRL">
      </h1>

      <p class="lede">
        <span lang="fr">Portée par le collectif.</span>
        <span lang="en">Worn by the collective.</span>
      </p>
    </main>

    <!-- Add product photos here, then remove the hidden attribute.
         <img src="photos/01.jpg" alt=""> -->
    <section class="pieces" hidden></section>
  </div>

  <footer>
    <nav class="social">
      <a href="https://www.tiktok.com/@mntrl.co" rel="noopener noreferrer" target="_blank">TikTok</a>
      <a href="https://www.instagram.com/mntrl.co/" rel="noopener noreferrer" target="_blank">Instagram</a>
      <a href="https://x.com/mntrl_co" rel="noopener noreferrer" target="_blank">X</a>
    </nav>
    <p class="legal">© <span data-year></span> MNTRL. <span lang="fr">Tous droits réservés.</span><span lang="en">All rights reserved.</span></p>
  </footer>

  <script src="lang.js"></script>
</body>
</html>
